name: Retail Service ServiceRing Patch Deploy

on:
  workflow_dispatch:
    inputs:
      service_ring:
        description: "Production ServiceRing to patch."
        required: true
        default: "eastus-ring0"
        type: choice
        options:
          - eastus-ring0
          - eastus-ring1
          - westus-ring0
          - westus-ring1
      patch:
        description: "Patch to deploy. Patch 2 contains the Purchase bug."
        required: true
        default: "Patch 2"
        type: choice
        options:
          - "Patch 1"
          - "Patch 2"
          - "Patch 3"

permissions:
  contents: read
  id-token: write

env:
  RESOURCE_GROUP: rg-cloudmain-retail-demo
  ACR_NAME: acrretaildemo7txptnpdvdf3e
  ACR_LOGIN_SERVER: acrretaildemo7txptnpdvdf3e.azurecr.io

jobs:
  deploy:
    name: Deploy patch to selected ServiceRing
    runs-on: ubuntu-latest
    environment: retail-demo
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Azure Container Apps CLI support
        run: az extension add --name containerapp --upgrade

      - name: Select production ServiceRing
        id: service_ring
        shell: bash
        env:
          SERVICE_RING: ${{ inputs.service_ring }}
        run: |
          set -euo pipefail

          case "$SERVICE_RING" in
            eastus-ring0)
              app_name="ca-retaildemo-sl-eus-r0"
              capacity="5"
              ;;
            eastus-ring1)
              app_name="ca-retaildemo-sl-eus-r1"
              capacity="45"
              ;;
            westus-ring0)
              app_name="ca-retaildemo-sl-wus-r0"
              capacity="5"
              ;;
            westus-ring1)
              app_name="ca-retaildemo-sl-wus-r1"
              capacity="45"
              ;;
            *)
              echo "Unknown ServiceRing: $SERVICE_RING"
              exit 1
              ;;
          esac

          echo "app_name=$app_name" >> "$GITHUB_OUTPUT"
          echo "capacity=$capacity" >> "$GITHUB_OUTPUT"

      - name: Build retail service patch image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          tag="retail-service:service-ring-patch-${GITHUB_SHA::12}"
          image="$ACR_LOGIN_SERVER/$tag"

          az acr build \
            --registry "$ACR_NAME" \
            --image "$tag" \
            --file demo-dotnet/src/RetailService/Dockerfile \
            .

          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Deploy patch and leave ServiceRing patched
        shell: bash
        env:
          APP_NAME: ${{ steps.service_ring.outputs.app_name }}
          CAPACITY: ${{ steps.service_ring.outputs.capacity }}
          PATCH_IMAGE: ${{ steps.image.outputs.image }}
          PATCH_NAME: ${{ inputs.patch }}
          SERVICE_RING: ${{ inputs.service_ring }}
        run: |
          set -euo pipefail
          echo "Deploying retail service $PATCH_NAME to $SERVICE_RING (${CAPACITY}% capacity ServiceRing)."
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --image "$PATCH_IMAGE" \
            --set-env-vars Demo__Version="$PATCH_NAME"

          echo "::warning::Patch deployed and intentionally left on $SERVICE_RING. Trigger Retail Service ServiceRing Patch Rollback when ready."
