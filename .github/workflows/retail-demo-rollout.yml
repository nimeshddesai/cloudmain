name: Retail Service Patch

on:
  workflow_dispatch:
    inputs:
      rollout_mode:
        description: "Rollout topology to use."
        required: true
        default: "sliced"
        type: choice
        options:
          - sliced
          - current
      patch_version:
        description: "Patch version to deploy. Use v2-bad to fail PurchaseItem."
        required: true
        default: "v2-bad"
        type: choice
        options:
          - v2-bad
          - v2
      stable_image:
        description: "Known-good service image used for rollback."
        required: true
        default: "acrretaildemo7txptnpdvdf3e.azurecr.io/retail-service:v1"

permissions:
  contents: read
  id-token: write

env:
  RESOURCE_GROUP: rg-cloudmain-retail-demo
  ACR_NAME: acrretaildemo7txptnpdvdf3e
  ACR_LOGIN_SERVER: acrretaildemo7txptnpdvdf3e.azurecr.io
  FRONT_DOOR_URL: https://retail-retaildemo-bjg2ebhydwemckfr.z02.azurefd.net

jobs:
  rollout:
    name: Deploy retail service patch safely
    runs-on: ubuntu-latest
    environment: retail-demo
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare .NET tooling
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Azure Container Apps CLI support
        run: az extension add --name containerapp --upgrade

      - name: Build retail service patch image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          tag="retail-service:${GITHUB_SHA::12}"
          image="$ACR_LOGIN_SERVER/$tag"

          az acr build \
            --registry "$ACR_NAME" \
            --image "$tag" \
            --file demo-dotnet/src/RetailService/Dockerfile \
            .

          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Prepare checkout validation
        run: dotnet restore demo-dotnet/src/SyntheticRunner/SyntheticRunner.csproj

      - name: Deploy patch and validate checkout health
        shell: bash
        env:
          PATCH_IMAGE: ${{ steps.image.outputs.image }}
          PATCH_VERSION: ${{ inputs.patch_version }}
          ROLLOUT_MODE: ${{ inputs.rollout_mode }}
          SYNTHETIC_KEY: ${{ secrets.SYNTHETIC_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$SYNTHETIC_KEY" ]]; then
            echo "SYNTHETIC_KEY secret is required."
            exit 1
          fi

          if [[ "$ROLLOUT_MODE" == "current" ]]; then
            targets=(
              "ca-retaildemo-cur-eus|eastus|50"
              "ca-retaildemo-cur-wus|westus|50"
            )
          else
            targets=(
              "ca-retaildemo-sl-eus-r0|eastus-ring0|5"
              "ca-retaildemo-sl-eus-r1|eastus-ring1|45"
              "ca-retaildemo-sl-wus-r0|westus-ring0|5"
              "ca-retaildemo-sl-wus-r1|westus-ring1|45"
            )
          fi

          for target in "${targets[@]}"; do
            IFS="|" read -r app_name slice capacity <<< "$target"

            echo "::group::Deploy patch to $slice"
            echo "Deploying retail service patch $PATCH_VERSION to $app_name ($slice, ${capacity}% capacity)"
            az containerapp update \
              --resource-group "$RESOURCE_GROUP" \
              --name "$app_name" \
              --image "$PATCH_IMAGE" \
              --set-env-vars Demo__Version="$PATCH_VERSION"
            echo "::endgroup::"

            echo "::group::Validate checkout path in $slice"
            echo "Running checkout validation for $slice through Azure Front Door"
            if ! dotnet run --project demo-dotnet/src/SyntheticRunner -- \
              --url "$FRONT_DOOR_URL" \
              --target-slice "$slice" \
              --synthetic-key "$SYNTHETIC_KEY"; then
              echo "::endgroup::"
              echo "::error::Checkout validation failed for $slice. Patch rollout stopped before wider impact."
              echo "FAILED_APP=$app_name" >> "$GITHUB_ENV"
              echo "FAILED_SLICE=$slice" >> "$GITHUB_ENV"
              echo "FAILED_CAPACITY=$capacity" >> "$GITHUB_ENV"
              exit 1
            fi
            echo "::endgroup::"

            echo "Checkout validation passed for $slice"
          done

          echo "Retail service patch rollout completed successfully."

      - name: Rollback failed rollout target
        if: failure() && env.FAILED_APP != ''
        shell: bash
        env:
          STABLE_IMAGE: ${{ inputs.stable_image }}
        run: |
          set -euo pipefail
          echo "Rolling back $FAILED_SLICE (${FAILED_CAPACITY}% capacity target) to the known-good retail service image."
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FAILED_APP" \
            --image "$STABLE_IMAGE" \
            --set-env-vars Demo__Version=v1

      - name: Stop patch rollout before wider impact
        if: failure() && env.FAILED_APP != ''
        run: |
          echo "Retail service patch rollout stopped after failed checkout validation in $FAILED_SLICE."
