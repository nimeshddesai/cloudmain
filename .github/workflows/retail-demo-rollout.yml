name: Retail Service Patch

on:
  workflow_dispatch:
    inputs:
      rollout_mode:
        description: "Rollout topology to use."
        required: true
        default: "service-rings"
        type: choice
        options:
          - service-rings
          - current
      patch:
        description: "Patch to deploy. Patch 2 contains the Purchase bug."
        required: true
        default: "Patch 2"
        type: choice
        options:
          - "Patch 1"
          - "Patch 2"
          - "Patch 3"
      stable_image:
        description: "Known-good service image tag or fully qualified image used for rollback."
        required: true
        default: "retail-service:v1"
      rollback_on_failure:
        description: "Automatically roll back the failed target."
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
  FRONT_DOOR_URL: ${{ vars.AZURE_FRONT_DOOR_URL }}

jobs:
  rollout:
    name: Deploy retail service patch safely
    runs-on: ubuntu-latest
    environment: retail-demo
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare .NET tooling
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Azure Container Apps CLI support
        run: az extension add --name containerapp --upgrade

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(RESOURCE_GROUP ACR_NAME ACR_LOGIN_SERVER FRONT_DOOR_URL)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::GitHub environment variable $name is required."
              exit 1
            fi
          done

      - name: Build retail service patch image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          tag="retail-service:${GITHUB_SHA::12}"
          image="$ACR_LOGIN_SERVER/$tag"

          az acr build \
            --registry "$ACR_NAME" \
            --image "$tag" \
            --file demo-dotnet/src/RetailService/Dockerfile \
            .

          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Prepare checkout validation
        run: dotnet restore demo-dotnet/src/SyntheticRunner/SyntheticRunner.csproj

      - name: Deploy patch and validate checkout health
        shell: bash
        env:
          PATCH_IMAGE: ${{ steps.image.outputs.image }}
          PATCH_NAME: ${{ inputs.patch }}
          ROLLOUT_MODE: ${{ inputs.rollout_mode }}
          ROLLBACK_ON_FAILURE: ${{ inputs.rollback_on_failure }}
          SYNTHETIC_KEY: ${{ secrets.SYNTHETIC_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$SYNTHETIC_KEY" ]]; then
            echo "SYNTHETIC_KEY secret is required."
            exit 1
          fi

          if [[ "$ROLLOUT_MODE" == "current" ]]; then
            targets=(
              "ca-retaildemo-cur-eus|eastus|50"
              "ca-retaildemo-cur-wus|westus|50"
            )
          else
            targets=(
              "ca-retaildemo-sl-eus-r0|eastus-ring0|5"
              "ca-retaildemo-sl-eus-r1|eastus-ring1|45"
              "ca-retaildemo-sl-wus-r0|westus-ring0|5"
              "ca-retaildemo-sl-wus-r1|westus-ring1|45"
            )
          fi

          for target in "${targets[@]}"; do
            IFS="|" read -r app_name service_ring capacity <<< "$target"

            echo "::group::Deploy $PATCH_NAME to $service_ring"
            echo "Deploying retail service $PATCH_NAME to $app_name ($service_ring, ${capacity}% capacity)"
            az containerapp update \
              --resource-group "$RESOURCE_GROUP" \
              --name "$app_name" \
              --image "$PATCH_IMAGE" \
              --set-env-vars Demo__Version="$PATCH_NAME"
            echo "::endgroup::"

            echo "::group::Validate checkout path in $service_ring"
            echo "Running checkout validation for $service_ring through Azure Front Door"
            if ! dotnet run --project demo-dotnet/src/SyntheticRunner -- \
              --url "$FRONT_DOOR_URL" \
              --target-slice "$service_ring" \
              --synthetic-key "$SYNTHETIC_KEY"; then
              echo "::endgroup::"
              echo "::error::Checkout validation failed for $service_ring. Patch rollout stopped before wider impact."
              echo "FAILED_APP=$app_name" >> "$GITHUB_ENV"
              echo "FAILED_SERVICE_RING=$service_ring" >> "$GITHUB_ENV"
              echo "FAILED_CAPACITY=$capacity" >> "$GITHUB_ENV"
              echo "FAILED_PATCH=$PATCH_NAME" >> "$GITHUB_ENV"
              echo "ROLLBACK_ON_FAILURE=$ROLLBACK_ON_FAILURE" >> "$GITHUB_ENV"
              exit 1
            fi
            echo "::endgroup::"

            echo "Checkout validation passed for $service_ring"
          done

          echo "Retail service patch rollout completed successfully."

      - name: Rollback failed rollout target
        if: failure() && env.FAILED_APP != '' && env.ROLLBACK_ON_FAILURE == 'true'
        shell: bash
        env:
          STABLE_IMAGE: ${{ inputs.stable_image }}
        run: |
          set -euo pipefail
          if [[ "$STABLE_IMAGE" != */* ]]; then
            STABLE_IMAGE="$ACR_LOGIN_SERVER/$STABLE_IMAGE"
          fi
          echo "Rolling back $FAILED_SERVICE_RING (${FAILED_CAPACITY}% capacity target) to the known-good retail service image."
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FAILED_APP" \
            --image "$STABLE_IMAGE" \
            --set-env-vars Demo__Version=v1

      - name: Leave failed target patched for observation
        if: failure() && env.FAILED_APP != '' && env.ROLLBACK_ON_FAILURE != 'true'
        run: |
          echo "Rollback is disabled for this run."
          echo "$FAILED_PATCH remains deployed on $FAILED_SERVICE_RING for observation."
          echo "Run Retail Service Patch Rollback when ready to restore the target."

      - name: Notify deployment incident
        if: failure() && env.FAILED_APP != ''
        shell: bash
        env:
          INCIDENT_WEBHOOK: ${{ secrets.DEPLOYMENT_INCIDENT_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          message="Retail service deployment incident: $FAILED_PATCH failed checkout validation on $FAILED_SERVICE_RING (${FAILED_CAPACITY}% capacity target). Rollback on failure: $ROLLBACK_ON_FAILURE. Run: $RUN_URL"
          echo "::warning::$message"

          if [[ -z "${INCIDENT_WEBHOOK:-}" ]]; then
            echo "DEPLOYMENT_INCIDENT_WEBHOOK is not configured; skipping external incident notification."
            exit 0
          fi

          curl -fsS \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"$message\"}" \
            "$INCIDENT_WEBHOOK"

      - name: Stop patch rollout before wider impact
        if: failure() && env.FAILED_APP != ''
        run: |
          echo "Retail service patch rollout stopped after failed checkout validation in $FAILED_SERVICE_RING."
