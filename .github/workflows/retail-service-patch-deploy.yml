name: Retail Service Patch Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target to patch."
        required: true
        default: "eastus"
        type: choice
        options:
          - eastus
          - westus
          - eastus-ring0
          - eastus-ring1
          - westus-ring0
          - westus-ring1
      patch_version:
        description: "Patch version to deploy. Use v2-bad to fail Purchase."
        required: true
        default: "v2-bad"
        type: choice
        options:
          - v2-bad
          - v2

permissions:
  contents: read
  id-token: write

env:
  RESOURCE_GROUP: rg-cloudmain-retail-demo
  ACR_NAME: acrretaildemo7txptnpdvdf3e
  ACR_LOGIN_SERVER: acrretaildemo7txptnpdvdf3e.azurecr.io

jobs:
  deploy:
    name: Deploy patch and leave target degraded
    runs-on: ubuntu-latest
    environment: retail-demo
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Azure Container Apps CLI support
        run: az extension add --name containerapp --upgrade

      - name: Select retail service target
        id: target
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          case "$TARGET" in
            eastus)
              app_name="ca-retaildemo-cur-eus"
              capacity="50"
              ;;
            westus)
              app_name="ca-retaildemo-cur-wus"
              capacity="50"
              ;;
            eastus-ring0)
              app_name="ca-retaildemo-sl-eus-r0"
              capacity="5"
              ;;
            eastus-ring1)
              app_name="ca-retaildemo-sl-eus-r1"
              capacity="45"
              ;;
            westus-ring0)
              app_name="ca-retaildemo-sl-wus-r0"
              capacity="5"
              ;;
            westus-ring1)
              app_name="ca-retaildemo-sl-wus-r1"
              capacity="45"
              ;;
            *)
              echo "Unknown target: $TARGET"
              exit 1
              ;;
          esac

          echo "app_name=$app_name" >> "$GITHUB_OUTPUT"
          echo "capacity=$capacity" >> "$GITHUB_OUTPUT"

      - name: Build retail service patch image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          tag="retail-service:manual-patch-${GITHUB_SHA::12}"
          image="$ACR_LOGIN_SERVER/$tag"

          az acr build \
            --registry "$ACR_NAME" \
            --image "$tag" \
            --file demo-dotnet/src/RetailService/Dockerfile \
            .

          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Deploy patch to selected target
        shell: bash
        env:
          APP_NAME: ${{ steps.target.outputs.app_name }}
          CAPACITY: ${{ steps.target.outputs.capacity }}
          PATCH_IMAGE: ${{ steps.image.outputs.image }}
          PATCH_VERSION: ${{ inputs.patch_version }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          echo "Deploying retail service patch $PATCH_VERSION to $TARGET (${CAPACITY}% capacity target)."
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --image "$PATCH_IMAGE" \
            --set-env-vars Demo__Version="$PATCH_VERSION"

          echo "::warning::Patch deployed and intentionally left in place. Trigger Retail Service Patch Rollback after observing status."
