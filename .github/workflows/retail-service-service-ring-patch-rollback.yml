name: Retail Service ServiceRing Patch Rollback

on:
  workflow_dispatch:
    inputs:
      service_ring:
        description: "Production ServiceRing to roll back."
        required: true
        default: "eastus-ring0"
        type: choice
        options:
          - eastus-ring0
          - eastus-ring1
          - westus-ring0
          - westus-ring1
      stable_image:
        description: "Known-good service image used for rollback."
        required: true
        default: "acrretaildemo7txptnpdvdf3e.azurecr.io/retail-service:v1"

permissions:
  contents: read
  id-token: write

env:
  RESOURCE_GROUP: rg-cloudmain-retail-demo

jobs:
  rollback:
    name: Rollback selected production ServiceRing
    runs-on: ubuntu-latest
    environment: retail-demo
    steps:
      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Azure Container Apps CLI support
        run: az extension add --name containerapp --upgrade

      - name: Select production ServiceRing
        id: service_ring
        shell: bash
        env:
          SERVICE_RING: ${{ inputs.service_ring }}
        run: |
          set -euo pipefail

          case "$SERVICE_RING" in
            eastus-ring0)
              app_name="ca-retaildemo-sl-eus-r0"
              capacity="5"
              ;;
            eastus-ring1)
              app_name="ca-retaildemo-sl-eus-r1"
              capacity="45"
              ;;
            westus-ring0)
              app_name="ca-retaildemo-sl-wus-r0"
              capacity="5"
              ;;
            westus-ring1)
              app_name="ca-retaildemo-sl-wus-r1"
              capacity="45"
              ;;
            *)
              echo "Unknown ServiceRing: $SERVICE_RING"
              exit 1
              ;;
          esac

          echo "app_name=$app_name" >> "$GITHUB_OUTPUT"
          echo "capacity=$capacity" >> "$GITHUB_OUTPUT"

      - name: Rollback selected ServiceRing to known-good service
        shell: bash
        env:
          APP_NAME: ${{ steps.service_ring.outputs.app_name }}
          CAPACITY: ${{ steps.service_ring.outputs.capacity }}
          STABLE_IMAGE: ${{ inputs.stable_image }}
          SERVICE_RING: ${{ inputs.service_ring }}
        run: |
          set -euo pipefail
          echo "Rolling back $SERVICE_RING (${CAPACITY}% capacity ServiceRing) to the known-good retail service image."
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --image "$STABLE_IMAGE" \
            --set-env-vars Demo__Version=v1
