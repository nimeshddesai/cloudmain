name: Retail Service Patch Rollback

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target to roll back."
        required: true
        default: "eastus"
        type: choice
        options:
          - eastus
          - westus
          - eastus-ring0
          - eastus-ring1
          - westus-ring0
          - westus-ring1
      stable_image:
        description: "Known-good service image used for rollback."
        required: true
        default: "acrretaildemo7txptnpdvdf3e.azurecr.io/retail-service:v1"

permissions:
  contents: read
  id-token: write

env:
  RESOURCE_GROUP: rg-cloudmain-retail-demo

jobs:
  rollback:
    name: Rollback selected retail service target
    runs-on: ubuntu-latest
    environment: retail-demo
    steps:
      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Azure Container Apps CLI support
        run: az extension add --name containerapp --upgrade

      - name: Select retail service target
        id: target
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          case "$TARGET" in
            eastus)
              app_name="ca-retaildemo-cur-eus"
              capacity="50"
              ;;
            westus)
              app_name="ca-retaildemo-cur-wus"
              capacity="50"
              ;;
            eastus-ring0)
              app_name="ca-retaildemo-sl-eus-r0"
              capacity="5"
              ;;
            eastus-ring1)
              app_name="ca-retaildemo-sl-eus-r1"
              capacity="45"
              ;;
            westus-ring0)
              app_name="ca-retaildemo-sl-wus-r0"
              capacity="5"
              ;;
            westus-ring1)
              app_name="ca-retaildemo-sl-wus-r1"
              capacity="45"
              ;;
            *)
              echo "Unknown target: $TARGET"
              exit 1
              ;;
          esac

          echo "app_name=$app_name" >> "$GITHUB_OUTPUT"
          echo "capacity=$capacity" >> "$GITHUB_OUTPUT"

      - name: Rollback selected target to known-good service
        shell: bash
        env:
          APP_NAME: ${{ steps.target.outputs.app_name }}
          CAPACITY: ${{ steps.target.outputs.capacity }}
          STABLE_IMAGE: ${{ inputs.stable_image }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          echo "Rolling back $TARGET (${CAPACITY}% capacity target) to the known-good retail service image."
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --image "$STABLE_IMAGE" \
            --set-env-vars Demo__Version=v1
