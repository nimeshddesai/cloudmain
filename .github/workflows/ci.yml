name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_ENV: development

      - name: Run tests
        run: npm test

      - name: Build static site
        run: |
          mkdir -p build
          cp -R index.html styles.css images build/
          cp netlify.toml _redirects build/ 2>/dev/null || true
